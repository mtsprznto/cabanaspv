allowBuilds:
  unrs-resolver: true

# pnpm >= 11 lee overrides SOLO aquí (ignora el campo "pnpm" de package.json).
overrides:
  # CVE-2025-69021 / GHSA-7r94-hfm9-h6rj: postcss < 8.5.23.
  # next@15.5.28 fija postcss@8.4.31 exacto (todavía vulnerable) → forzar ≥ 8.5.30.
  postcss: ^8.5.30
  # CVE-2025-87641 / GHSA-rj75-hqrm-r3gf: postcss-selector-parser < 7.1.6.
  # tailwindcss@3 exige ^6.1.2 y no hay parche en 6.x → salto a 7.1.6.
  # Si el build de Tailwind falla, eliminar esta línea y aceptar el riesgo residual
  # (DoS en build-time, no afecta runtime de producción).
  postcss-selector-parser: ^7.1.6
  # ReDoS (GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74):
  # @typescript-eslint/* fija ^9.0.4 y el lock resolvió 9.0.3 → forzar 9.0.9.
  # Acotado a ^9 para no tocar minimatch@3 (tailwind/otros) ni minimatch@10.
  'minimatch@^9': ^9.0.9
  # NOTA (riesgo residual aceptado): braces GHSA-vfj7-8cjw-p6xm exige >=3.0.4
  # pero esa versión NUNCA se publicó en npm (última real: 3.0.3). Solo afecta
  # a la cadena dev de eslint (fast-glob/micromatch), nunca a runtime.
  # Si el vendor publica 3.0.x parchada, quitar este comentario y re-auditar.
